name: Validar migrations do Supabase

# O banco de produção ainda não possui baseline confiável em schema_migrations.
# Portanto este workflow apenas valida os arquivos. A aplicação integral das
# migrations permanece bloqueada até o baseline completo ser reconciliado.

on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "scripts/prepare-cs-cx-schema.mjs"
      - "scripts/prepare-sd-time-schema.mjs"
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "scripts/prepare-cs-cx-schema.mjs"
      - "scripts/prepare-sd-time-schema.mjs"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - name: Validar pacote transacional CS/CX
        run: npm run prepare:cs-cx -- --static
      - name: Validar pacote transacional de horas do SD
        run: npm run prepare:sd-time -- --static
